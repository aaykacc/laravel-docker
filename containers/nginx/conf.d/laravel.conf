server {
    listen 80;
    server_name aykac.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name aykac.dev;

    index index.php;
    root /var/www/public;

    ssl_certificate /etc/nginx/certs/aykac.dev.crt;
    ssl_certificate_key /etc/nginx/certs/aykac.dev.key;

    location ~ \.php$ {
      try_files $uri =404;
      fastcgi_split_path_info ^(.+\.php)(/.+)$;
      fastcgi_pass aykac_php:9000;
      fastcgi_index index.php;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ /\.ht {
      deny all;
    }

}